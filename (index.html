<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM • Funil de Vendas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
  header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; }
  header h1 { font-size: 20px; font-weight: 700; }

  .board { display: flex; gap: 12px; overflow-x: auto; padding: 16px; align-items: flex-start; }
  .column {
    flex-shrink: 0; width: 290px; background: #f1f5f9; border-radius: 10px;
    border-top: 4px solid #94a3b8; display: flex; flex-direction: column; max-height: 85vh;
  }
  .column.dragover { outline: 2px dashed #3b82f6; outline-offset: -2px; }

  .column[data-status="PRIMEIRO_ATENDIMENTO"] { border-top-color: #94a3b8; }
  .column[data-status="VISITA_TECNICA"] { border-top-color: #60a5fa; }
  .column[data-status="MONTAGEM_ORCAMENTO"] { border-top-color: #818cf8; }
  .column[data-status="ORCAMENTO_ENVIADO"] { border-top-color: #fbbf24; }
  .column[data-status="PENDENCIAS"] { border-top-color: #fb923c; }
  .column[data-status="PEDIDO_APROVADO"] { border-top-color: #4ade80; }
  .column[data-status="PEDIDO_REPROVADO"] { border-top-color: #f87171; }
  .column[data-status="PRODUCAO"] { border-top-color: #a78bfa; }

  .column-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
  .column-header h3 { font-size: 13px; font-weight: 600; color: #334155; }
  .count-badge { font-size: 11px; background: #cbd5e1; color: #334155; border-radius: 999px; padding: 2px 8px; }
  .cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }

  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; cursor: grab; transition: box-shadow .15s, opacity .15s; }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card.dragging { opacity: 0.4; }

  .card-title { font-size: 13px; font-weight: 600; }
  .card-client { font-size: 12px; color: #64748b; margin-top: 2px; }
  .card-phone { font-size: 10px; color: #94a3b8; margin-top: 8px; }
  .info-row { font-size: 11px; color: #475569; margin-top: 6px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; margin-top: 6px; }
  .badge.frio { background: #dbeafe; color: #1d4ed8; }
  .badge.morno { background: #fef9c3; color: #a16207; }
  .badge.quente { background: #fee2e2; color: #b91c1c; }
  .views-text { font-size: 11px; color: #94a3b8; margin-left: 6px; }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 10px; background: #ffedd5; color: #c2410c; padding: 2px 6px; border-radius: 4px; }
  .rejection-reason { font-size: 11px; color: #dc2626; font-style: italic; margin-top: 6px; }

  .progress-wrap { margin-top: 6px; }
  .progress-bar-bg { width: 100%; background: #e2e8f0; border-radius: 999px; height: 6px; margin-top: 4px; }
  .progress-bar-fill { background: #8b5cf6; height: 6px; border-radius: 999px; }
  .deadline { font-size: 10px; color: #94a3b8; margin-top: 4px; }

  /* ===== Bloco de orçamento PDF ===== */
  .pdf-section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed #e2e8f0;
  }
  .pdf-upload-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #4f46e5;
    background: #eef2ff;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
  }
  .pdf-upload-label:hover { background: #e0e7ff; }
  .pdf-upload-label input { display: none; }

  .pdf-attached {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 11px;
  }
  .pdf-attached .pdf-name { color: #334155; font-weight: 500; }
  .pdf-actions { display: flex; gap: 6px; margin-top: 6px; }
  .pdf-btn {
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 500;
  }
  .pdf-btn.copy { background: #4f46e5; color: #fff; }
  .pdf-btn.copy:hover { background: #4338ca; }
  .pdf-btn.replace { background: #f1f5f9; color: #475569; }
  .pdf-btn.replace:hover { background: #e2e8f0; }

  /* ===== Botão adicionar card ===== */
  .add-card-btn {
    margin: 4px 8px 10px 8px; padding: 8px; background: #fff;
    border: 1px dashed #cbd5e1; border-radius: 8px; color: #64748b;
    font-size: 12px; font-weight: 500; cursor: pointer; text-align: center;
    transition: background .15s, border-color .15s;
  }
  .add-card-btn:hover { background: #eef2ff; border-color: #818cf8; color: #4338ca; }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; width: 340px; border-radius: 10px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .modal-box h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .modal-box .modal-subtitle { font-size: 12px; color: #64748b; margin-bottom: 14px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px; }
  .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
  .form-group input:focus { border-color: #6366f1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .btn-cancel { background: #f1f5f9; color: #475569; }
  .btn-cancel:hover { background: #e2e8f0; }
  .btn-save { background: #4f46e5; color: #fff; }
  .btn-save:hover { background: #4338ca; }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 200;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header><h1>CRM • Funil de Vendas</h1></header>

<div class="board" id="board"></div>

<!-- Modal novo card -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2>Novo Card</h2>
    <p class="modal-subtitle" id="modalSubtitle">Adicionar em: —</p>
    <form id="cardForm">
      <div class="form-group">
        <label for="inputCliente">Nome do Cliente</label>
        <input type="text" id="inputCliente" placeholder="Ex: João Silva" required>
      </div>
      <div class="form-group">
        <label for="inputTelefone">Telefone</label>
        <input type="text" id="inputTelefone" placeholder="Ex: (41) 99999-0000" required>
      </div>
      <div class="form-group">
        <label for="inputProjeto">Projeto</label>
        <input type="text" id="inputProjeto" placeholder="Ex: Fachada Loja X" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" id="btnCancel">Cancelar</button>
        <button type="submit" class="btn btn-save">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===== DADOS MOCKADOS =====
  let atendimentos = [
    { id: '1', titulo: 'Fachada Loja Center Norte', clienteNome: 'João Silva', clienteTelefone: '(41) 99999-1111', status: 'PRIMEIRO_ATENDIMENTO' },
    { id: '2', titulo: 'Letra Caixa Padaria Doce Vida', clienteNome: 'Maria Souza', clienteTelefone: '(41) 99999-2222', status: 'VISITA_TECNICA', visitaTecnica: { dataVisita: '2026-07-28T14:00:00', medidas: '3m x 1.2m' } },
    { id: '3', titulo: 'Adesivagem Frota - Transporte XYZ', clienteNome: 'Carlos Lima', clienteTelefone: '(41) 99999-3333', status: 'MONTAGEM_ORCAMENTO' },
    { id: '4', titulo: 'Banner Evento Corporativo', clienteNome: 'Ana Paula', clienteTelefone: '(41) 99999-4444', status: 'ORCAMENTO_ENVIADO' },
    { id: '5', titulo: 'Fachada ACM Clínica Bem Estar', clienteNome: 'Roberto Alves', clienteTelefone: '(41) 99999-5555', status: 'ORCAMENTO_ENVIADO' },
    { id: '6', titulo: 'Placas Sinalização Condomínio', clienteNome: 'Fernanda Costa', clienteTelefone: '(41) 99999-6666', status: 'PENDENCIAS', pendencias: ['MATERIAL', 'PAGAMENTO'] },
    { id: '7', titulo: 'Totem Luminoso Posto de Gasolina', clienteNome: 'Marcos Pereira', clienteTelefone: '(41) 99999-7777', status: 'PEDIDO_APROVADO' },
    { id: '8', titulo: 'Fachada Loja de Roupas', clienteNome: 'Juliana Rocha', clienteTelefone: '(41) 99999-8888', status: 'PEDIDO_REPROVADO', motivoReprovacao: 'Cliente achou orçamento com concorrente mais barato' },
    { id: '9', titulo: 'Letra Caixa Farmácia Popular', clienteNome: 'Ricardo Souza', clienteTelefone: '(41) 99999-9999', status: 'PRODUCAO', producao: { prazoEntrega: '2026-08-05', etapaAtual: 'MONTAGEM_LETRA_CAIXA', progresso: 60 } },
  ];

  const COLUNAS = [
    { id: 'PRIMEIRO_ATENDIMENTO', label: '1º Atendimento' },
    { id: 'VISITA_TECNICA', label: 'Visita Técnica' },
    { id: 'MONTAGEM_ORCAMENTO', label: 'Montagem de Orçamento' },
    { id: 'ORCAMENTO_ENVIADO', label: 'Orçamento Enviado' },
    { id: 'PENDENCIAS', label: 'Pendências' },
    { id: 'PEDIDO_APROVADO', label: 'Pedido Aprovado' },
    { id: 'PEDIDO_REPROVADO', label: 'Pedido Reprovado' },
    { id: 'PRODUCAO', label: 'Produção' },
  ];

  // ===== CLASSIFICAÇÃO DE TEMPERATURA =====
  // 1-2 visualizações: frio | 3-4: morno | 5+: quente
  function classificarCliente(views) {
    if (views >= 5) return 'quente';
    if (views >= 3) return 'morno';
    if (views >= 1) return 'frio';
    return null;
  }
  const TEMP_ICON = { frio: '🧊', morno: '🌤️', quente: '🔥' };
  const TEMP_LABEL = { frio: 'Frio', morno: 'Morno', quente: 'Quente • Pronto p/ fechar!' };

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function formatDateOnly(dateStr) { return new Date(dateStr).toLocaleDateString('pt-BR'); }
  function gerarId() { return 'c_' + Date.now() + '_' + Math.floor(Math.random() * 1000); }

  // ===== PERSISTÊNCIA DE PDF E VISUALIZAÇÕES (localStorage) =====
  function getPdfData(id) {
    return localStorage.getItem('pdf_orcamento_' + id);
  }
  function getPdfName(id) {
    return localStorage.getItem('pdf_nome_' + id) || 'orcamento.pdf';
  }
  function setPdfData(id, dataUrl, fileName) {
    localStorage.setItem('pdf_orcamento_' + id, dataUrl);
    localStorage.setItem('pdf_nome_' + id, fileName);
  }
  function getViewCount(id) {
    const raw = localStorage.getItem('views_orcamento_' + id);
    if (!raw) return 0;
    try { return JSON.parse(raw).length; } catch { return 0; }
  }
  function getViewLink(id) {
    const base = location.href.replace(/index\.html.*$/, '').replace(/\/?$/, '/');
    return base + 'view.html?id=' + id;
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ===== RENDERIZAÇÃO DE CARD =====
  function renderPdfSection(a) {
    const pdfData = getPdfData(a.id);
    const views = getViewCount(a.id);
    const temp = classificarCliente(views);

    let html = `<div class="pdf-section">`;

    if (!pdfData) {
      html += `
        <label class="pdf-upload-label">
          📎 Adicionar Orçamento (PDF)
          <input type="file" accept="application/pdf" data-upload-id="${a.id}">
        </label>
      `;
    } else {
      html += `
        <div class="pdf-attached">
          <span class="pdf-name">📄 ${getPdfName(a.id)}</span>
        </div>
        <div class="pdf-actions">
          <button class="pdf-btn copy" data-copy-id="${a.id}">🔗 Copiar link</button>
          <label class="pdf-btn replace" style="display:inline-block;">
            Substituir
            <input type="file" accept="application/pdf" data-upload-id="${a.id}" style="display:none;">
          </label>
        </div>
      `;
      if (temp) {
        html += `
          <div>
            <span class="badge ${temp}">${TEMP_ICON[temp]} ${TEMP_LABEL[temp]}</span>
            <span class="views-text">${views} visualiza${views === 1 ? 'ção' : 'ções'}</span>
          </div>
        `;
      } else {
        html += `<div class="views-text" style="margin-top:6px;">👁 Ainda sem visualizações</div>`;
      }
    }

    html += `</div>`;
    return html;
  }

  function renderCardContent(a) {
    let html = `
      <div class="card-title">${a.titulo}</div>
      <div class="card-client">${a.clienteNome}</div>
    `;

    if (a.visitaTecnica) {
      html += `<div class="info-row">📅 ${a.visitaTecnica.dataVisita ? formatDate(a.visitaTecnica.dataVisita) : '-'}</div>`;
      if (a.visitaTecnica.medidas) html += `<div class="info-row">📐 ${a.visitaTecnica.medidas}</div>`;
    }

    if (a.pendencias) {
      html += `<div class="tags">` + a.pendencias.map(p => `<span class="tag">${p}</span>`).join('') + `</div>`;
    }

    if (a.motivoReprovacao) {
      html += `<div class="rejection-reason">⚠️ ${a.motivoReprovacao}</div>`;
    }

    if (a.producao) {
      html += `
        <div class="progress-wrap">
          <div class="info-row">🏭 ${a.producao.etapaAtual.replace(/_/g, ' ')}</div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${a.producao.progresso}%"></div></div>
          <div class="deadline">Prazo: ${formatDateOnly(a.producao.prazoEntrega)}</div>
        </div>
      `;
    }

    html += renderPdfSection(a);
    html += `<div class="card-phone">📞 ${a.clienteTelefone}</div>`;
    return html;
  }

  function createCardElement(a) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = a.id;
    card.innerHTML = renderCardContent(a);

    card.addEventListener('dragstart', () => card.classList.add('dragging'));
    card.addEventListener('dragend', () => card.classList.remove('dragging'));

    // Upload de PDF
    card.querySelectorAll('input[data-upload-id]').forEach(input => {
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.type !== 'application/pdf') {
          showToast('⚠️ Apenas arquivos PDF são permitidos');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          setPdfData(a.id, reader.result, file.name);
          showToast('✅ Orçamento anexado com sucesso!');
          renderBoard();
        };
        reader.readAsDataURL(file);
      });
    });

    // Copiar link
    const copyBtn = card.querySelector('[data-copy-id]');
    if (copyBtn) {
      copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const link = getViewLink(a.id);
        navigator.clipboard.writeText(link).then(() => {
          showToast('🔗 Link copiado! Envie ao cliente.');
        }).catch(() => {
          prompt('Copie o link abaixo:', link);
        });
      });
    }

    // Impede drag ao interagir com inputs/botões
    card.querySelectorAll('input, button, label').forEach(el => {
      el.addEventListener('mousedown', e => e.stopPropagation());
    });

    return card;
  }

  // ===== RENDERIZAÇÃO DO BOARD =====
  function renderBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';

    COLUNAS.forEach(coluna => {
      const cardsDaColuna = atendimentos.filter(a => a.status === coluna.id);

      const columnEl = document.createElement('div');
      columnEl.className = 'column';
      columnEl.dataset.status = coluna.id;
      columnEl.innerHTML = `
        <div class="column-header">
          <h3>${coluna.label}</h3>
          <span class="count-badge">${cardsDaColuna.length}</span>
        </div>
      `;

      const cardsContainer = document.createElement('div');
      cardsContainer.className = 'cards';
      cardsDaColuna.forEach(a => cardsContainer.appendChild(createCardElement(a)));
      columnEl.appendChild(cardsContainer);

      const addBtn = document.createElement('div');
      addBtn.className = 'add-card-btn';
      addBtn.textContent = '+ Novo Card';
      addBtn.addEventListener('click', () => openModal(coluna.id, coluna.label));
      columnEl.appendChild(addBtn);

      columnEl.addEventListener('dragover', (e) => { e.preventDefault(); columnEl.classList.add('dragover'); });
      columnEl.addEventListener('dragleave', () => columnEl.classList.remove('dragover'));
      columnEl.addEventListener('drop', (e) => {
        e.preventDefault();
        columnEl.classList.remove('dragover');
        const draggingCard = document.querySelector('.dragging');
        if (!draggingCard) return;
        const id = draggingCard.dataset.id;
        const atendimento = atendimentos.find(a => a.id === id);
        if (atendimento) { atendimento.status = coluna.id; renderBoard(); }
      });

      board.appendChild(columnEl);
    });
  }

  // ===== MODAL: adicionar novo card =====
  let colunaAtual = null;
  const modalOverlay = document.getElementById('modalOverlay');
  const modalSubtitle = document.getElementById('modalSubtitle');
  const cardForm = document.getElementById('cardForm');
  const inputCliente = document.getElementById('inputCliente');
  const inputTelefone = document.getElementById('inputTelefone');
  const inputProjeto = document.getElementById('inputProjeto');

  function openModal(statusId, statusLabel) {
    colunaAtual = statusId;
    modalSubtitle.textContent = 'Adicionar em: ' + statusLabel;
    cardForm.reset();
    modalOverlay.classList.add('open');
    inputCliente.focus();
  }
  function closeModal() { modalOverlay.classList.remove('open'); colunaAtual = null; }

  document.getElementById('btnCancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  cardForm.addEventListener('submit', (e) => {
    e.preventDefault();
    atendimentos.push({
      id: gerarId(),
      titulo: inputProjeto.value.trim(),
      clienteNome: inputCliente.value.trim(),
      clienteTelefone: inputTelefone.value.trim(),
      status: colunaAtual,
    });
    closeModal();
    renderBoard();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
  });

  // Atualiza o board em tempo real quando o cliente visualiza o PDF em outra aba
  window.addEventListener('storage', (e) => {
    if (e.key && e.key.startsWith('views_orcamento_')) {
      renderBoard();
    }
  });

  renderBoard();
</script>

</body>
</html>
